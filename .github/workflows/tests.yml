name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [highest, lowest]
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate package
        run: composer validate --strict --no-check-lock
      # Standalone resolution requires the public Flow 2.2 and Fields 1.0 stable tags.
      - run: composer config repositories.laravel-flow vcs https://github.com/MrNewport/laravel-flow
      - run: composer config repositories.laravel-fields vcs https://github.com/MrNewport/laravel-fields
      - name: Select framework test harness
        run: composer require --dev 'orchestra/testbench:${{ matrix.testbench }}' --no-update --no-interaction
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Run package tests
        run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer config repositories.laravel-flow vcs https://github.com/MrNewport/laravel-flow
      - run: composer config repositories.laravel-fields vcs https://github.com/MrNewport/laravel-fields
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer format:check
      - run: composer analyse
      - run: composer audit --locked --no-dev

  mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: package-test-only
          MYSQL_DATABASE: workflow_all_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppackage-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer require --dev 'orchestra/testbench:${{ matrix.testbench }}' --no-update --no-interaction
      - run: composer config repositories.laravel-flow vcs https://github.com/MrNewport/laravel-flow
      - run: composer config repositories.laravel-fields vcs https://github.com/MrNewport/laravel-fields
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
        env:
          WORKFLOW_ALL_MYSQL_TEST_DATABASE: workflow_all_test
          MYSQL_TEST_PASSWORD: package-test-only
